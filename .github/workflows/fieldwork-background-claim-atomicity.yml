name: Fieldwork background claim atomicity

on:
  pull_request:
    branches:
      - fieldwork/background-claim-atomicity-characterization
    paths:
      - .github/workflows/fieldwork-background-claim-atomicity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-background-claim-atomicity
  cancel-in-progress: true

env:
  GEMINI_SOURCE: 1522d0ae74acdb3ee71243829b8b1031565e3d54
  ACCEPTED_PARENT: 1c8a198295ecbd01971bb79f0ed6afed16e66dbf

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact characterization source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.GEMINI_SOURCE }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify exact source and one-file fence
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GEMINI_SOURCE"
          test "$(git -C source rev-parse HEAD~2)" = "$ACCEPTED_PARENT"
          git -C source diff --name-only "$ACCEPTED_PARENT..$GEMINI_SOURCE" | sort -u > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          packages/core/src/services/executionLifecycleService.backgroundClaim.characterization.test.ts
          EOF
          diff -u /tmp/expected-files /tmp/actual-files
          if grep -q '^\.github/' /tmp/actual-files; then
            echo 'execution carrier leaked into source fence' >&2
            exit 1
          fi
          echo 'FIELDWORK_BACKGROUND_CLAIM_SOURCE_FENCE=1/1'

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Check focused formatting
        working-directory: source
        run: |
          set -euo pipefail
          npx prettier --check \
            packages/core/src/services/executionLifecycleService.backgroundClaim.characterization.test.ts

      - name: Run characterization and adjacent lifecycle gates
        working-directory: source
        run: |
          set -euo pipefail
          npm run test --workspace @google/gemini-cli-core -- \
            src/services/executionLifecycleService.backgroundClaim.characterization.test.ts \
            src/services/executionLifecycleService.test.ts \
            src/services/shell-execution-process-exit-cleanup.test.ts \
            src/tools/shell-background-temp-ownership-repair.test.ts
          npm run typecheck --workspace @google/gemini-cli-core
          git diff --check
          test -z "$(git status --porcelain)"
          echo 'FIELDWORK_BACKGROUND_CLAIM_CHARACTERIZATION=complete'

      - name: Upload exact receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-background-claim-atomicity-receipt
          path: |
            /tmp/actual-files
            /tmp/expected-files
          if-no-files-found: error
          retention-days: 14

name: fieldwork-execution-lifecycle-async-kill

on:
  push:
    branches:
      - fieldwork/execution-lifecycle-await-termination
  pull_request:
    branches:
      - main
    paths:
      - packages/core/src/services/executionLifecycleService.async-kill.test.ts
      - .github/workflows/fieldwork-execution-lifecycle-async-kill.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-execution-lifecycle-async-kill
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute async kill ownership contract
        run: npm run test --workspace @google/gemini-cli-core -- src/services/executionLifecycleService.async-kill.test.ts
      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core

name: Fieldwork repair confirmation waiting carrier

on:
  push:
    branches:
      - fieldwork/confirmation-waiting-state-repair
    paths:
      - .github/workflows/fieldwork-fix-confirmation-waiting-carrier.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/confirmation-waiting-state-repair
          persist-credentials: true

      - name: Repair generated test controls
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              '.github/workflows/fieldwork-confirmation-waiting-state-repair.yml'
          )
          text = path.read_text(encoding='utf-8')

          old_import = """\
          import type {
            AnyDeclarativeTool,
            AnyToolInvocation,
            ToolCallConfirmationDetails,
          } from '../tools/tools.js';
          """
          new_import = """\
          import {
            ToolConfirmationOutcome,
            type AnyDeclarativeTool,
            type AnyToolInvocation,
            type ToolCallConfirmationDetails,
          } from '../tools/tools.js';
          """
          if text.count(old_import) != 1:
              raise SystemExit('tool import anchor mismatch')
          text = text.replace(old_import, new_import, 1)

          old_vi_import = (
              "          import { describe, expect, it, vi, type Mocked } "
              "from 'vitest';\n"
          )
          new_vi_import = (
              "          import { afterEach, describe, expect, it, vi, "
              "type Mocked } from 'vitest';\n"
          )
          if text.count(old_vi_import) != 1:
              raise SystemExit('vitest import anchor mismatch')
          text = text.replace(old_vi_import, new_vi_import, 1)

          helper_anchor = """\
          async function waitForBus(harness: ReturnType<typeof createHarness>) {
            await vi.waitFor(() => {
              expect(
                harness.messageBus.listenerCount(
                  MessageBusType.TOOL_CONFIRMATION_RESPONSE,
                ),
              ).toBeGreaterThan(0);
            });
          }

          describe('confirmation waiting ownership repair', () => {
          """
          helper_replacement = """\
          async function waitForBus(harness: ReturnType<typeof createHarness>) {
            await vi.waitFor(() => {
              expect(
                harness.messageBus.listenerCount(
                  MessageBusType.TOOL_CONFIRMATION_RESPONSE,
                ),
              ).toBeGreaterThan(0);
            });
          }

          function confirmationCorrelationId(
            harness: ReturnType<typeof createHarness>,
          ): string {
            const statusCall = harness.state.updateStatus.mock.calls.find(
              ([, status]) => status === CoreToolCallStatus.AwaitingApproval,
            );
            const data = statusCall?.[2] as { correlationId?: string } | undefined;
            expect(data?.correlationId).toBeDefined();
            return data?.correlationId ?? '';
          }

          describe('confirmation waiting ownership repair', () => {
            afterEach(() => {
              vi.restoreAllMocks();
            });
          """
          if text.count(helper_anchor) != 1:
              raise SystemExit('correlation helper anchor mismatch')
          text = text.replace(helper_anchor, helper_replacement, 1)

          if text.count('                correlationId: expect.anything(),') != 1:
              raise SystemExit('fake correlation matcher anchor mismatch')
          text = text.replace(
              '                correlationId: expect.anything(),',
              '                correlationId: confirmationCorrelationId(harness),',
              1,
          )

          if text.count("                outcome: 'proceed_once',") != 1:
              raise SystemExit('raw outcome anchor mismatch')
          text = text.replace(
              "                outcome: 'proceed_once',",
              '                outcome: ToolConfirmationOutcome.ProceedOnce,',
              1,
          )

          old_mock = """\
              const onWaitingChange = vi
                .fn<(waiting: boolean) => void>()
                .mockImplementationOnce(() => {
                  throw new Error('observer start failed');
                });
          """
          new_mock = """\
              const onWaitingChange = vi.fn((_waiting: boolean) => {});
              onWaitingChange.mockImplementationOnce(() => {
                throw new Error('observer start failed');
              });
          """
          if text.count(old_mock) != 1:
              raise SystemExit('typed vi.fn anchor mismatch')
          path.write_text(text.replace(old_mock, new_mock, 1), encoding='utf-8')

      - name: Publish repaired carrier
        run: |
          rm .github/workflows/fieldwork-fix-confirmation-waiting-carrier.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add .github/workflows
          git commit -m 'ci(fieldwork): repair waiting ownership controls'
          git push origin HEAD:fieldwork/confirmation-waiting-state-repair

name: Fieldwork Gemini candidate matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-gemini-candidate-matrix.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-gemini-candidate-matrix
  cancel-in-progress: true

jobs:
  focused-candidate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: discovered-tool abort handoff
            sha: 30da6f7566d394150f9d62522e374c42c931c072
            test: src/tools/tool-registry.abort.test.ts
          - name: inline approval call affinity
            sha: ab971e9a1e3e61602621064d12c1b92dca3569aa
            test: src/scheduler/confirmation.affinity.test.ts
          - name: approval waiting-state cleanup
            sha: 974f6e288bf3e86af0c06cb445b9626bd5d2280f
            test: src/scheduler/confirmation.waiting-state.test.ts
          - name: asynchronous kill ownership contract
            sha: e33c6715cd289f912574025580cd74e4da9fe5bc
            test: src/services/executionLifecycleService.async-kill.test.ts

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prepared regression
        id: regression
        continue-on-error: true
        run: >-
          npm run test --workspace @google/gemini-cli-core --
          ${{ matrix.test }}

      - name: Require predicted pinned-base failure
        env:
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected the prepared contract test to fail on its test-only candidate head; observed: $OUTCOME"
            exit 1
          fi

      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core

      - name: Record exact receipt
        run: |
          printf '%s\n' \
            "candidate=${{ matrix.name }}" \
            "sha=${{ matrix.sha }}" \
            "test=${{ matrix.test }}" \
            "node=$(node --version)" \
            "npm=$(npm --version)" \
            "regression_outcome=${{ steps.regression.outcome }}"

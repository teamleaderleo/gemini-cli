name: Fieldwork unit 16 approval generation ABA repair

on:
  pull_request:
    branches:
      - fix/scheduler-confirmation-call-affinity
    paths:
      - .github/workflows/fieldwork-unit-16-confirmation-affinity-aba.yml
      - .github/fieldwork/materialize-confirmation-generation-aba-repair.py

permissions:
  contents: write

concurrency:
  group: fieldwork-unit-16-confirmation-affinity-aba
  cancel-in-progress: true

env:
  SOURCE_BASE: f47d6c6f7a1308d81f9f57acf7d279f0928c5249
  SOURCE_HEAD: f94bdb7a065fd8333db7fe66a3a24d966e5dbdd4
  SOURCE_BRANCH: fix/scheduler-confirmation-call-affinity
  MATERIALIZER_REF: origin/fieldwork/unit-16-confirmation-affinity-aba-executor

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact source and seven-file fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git diff --name-only "$SOURCE_BASE"..HEAD | sort -u > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          packages/core/src/scheduler/confirmation.affinity.repair.test.ts
          packages/core/src/scheduler/confirmation.test.ts
          packages/core/src/scheduler/confirmation.ts
          packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          packages/core/src/scheduler/state-manager.approval-generation.test.ts
          packages/core/src/scheduler/state-manager.ts
          packages/core/src/scheduler/types.ts
          EOF
          sort -u /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$SOURCE_BASE"..HEAD

      - name: Materialize scheduler-wide monotonic generation repair
        run: |
          git show "$MATERIALIZER_REF:.github/fieldwork/materialize-confirmation-generation-aba-repair.py" | python3 -

      - name: Format and verify repair fence
        run: |
          npx prettier --write \
            packages/core/src/scheduler/state-manager.ts \
            packages/core/src/scheduler/state-manager.approval-generation.test.ts
          npx prettier --check \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts \
            packages/core/src/scheduler/state-manager.approval-generation.test.ts \
            packages/core/src/scheduler/state-manager.ts \
            packages/core/src/scheduler/types.ts
          npx eslint --max-warnings 0 \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts \
            packages/core/src/scheduler/state-manager.approval-generation.test.ts \
            packages/core/src/scheduler/state-manager.ts \
            packages/core/src/scheduler/types.ts
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            packages/core/src/scheduler/state-manager.approval-generation.test.ts
            packages/core/src/scheduler/state-manager.ts
          )
          test "${changed[*]}" = "${expected[*]}"
          git diff --check

      - name: Run focused and adjacent scheduler tests
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.affinity.repair.test.ts \
            src/scheduler/confirmation.test.ts \
            src/scheduler/scheduler.confirmation-affinity.test.ts \
            src/scheduler/state-manager.approval-generation.test.ts \
            src/scheduler/state-manager.test.ts

      - name: Run core build and typecheck
        run: |
          npm run build --workspace @google/gemini-cli-core
          npm run typecheck --workspace @google/gemini-cli-core

      - name: Publish exact validated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git config user.name 'Fieldwork Agent'
          git config user.email 'fieldwork-agent@users.noreply.github.com'
          git add \
            packages/core/src/scheduler/state-manager.ts \
            packages/core/src/scheduler/state-manager.approval-generation.test.ts
          git commit -m 'fix(core): keep approval generations unique across lifetimes'
          git push \
            --force-with-lease="refs/heads/$SOURCE_BRANCH:$SOURCE_HEAD" \
            origin "HEAD:refs/heads/$SOURCE_BRANCH"

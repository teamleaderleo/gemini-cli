name: Fieldwork confirmation waiting ownership exact head

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-confirmation-waiting-ownership-exact.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-confirmation-waiting-ownership-exact
  cancel-in-progress: true

jobs:
  staged-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Apply the reviewed staged repair
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(
              '.github/workflows/fieldwork-confirmation-waiting-ownership.yml'
          ).read_text(encoding='utf-8').splitlines()
          step = workflow.index(
              '      - name: Apply waiting ownership repair and controls'
          )
          run_line = next(
              index
              for index in range(step + 1, len(workflow))
              if workflow[index].strip() == 'run: |'
          )
          end = next(
              index
              for index in range(run_line + 1, len(workflow))
              if workflow[index].startswith('      - name: Use Node.js 22')
          )
          script_lines = []
          for line in workflow[run_line + 1 : end]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected patch-script indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'

          single_entry = """\
          if text.count(pass_anchor) != 1:
              raise SystemExit('scheduler callback anchor mismatch')
          text = text.replace(
              pass_anchor,
              'onWaitingForConfirmation: this.confirmationWaitTracker.update',
              1,
          )
          """
          both_entries = """\
          if text.count(pass_anchor) != 2:
              raise SystemExit('scheduler callback anchor mismatch')
          text = text.replace(
              pass_anchor,
              'onWaitingForConfirmation: this.confirmationWaitTracker.update',
              2,
          )
          """
          if script.count(single_entry) != 1:
              raise SystemExit('embedded callback patch shape changed')
          script = script.replace(single_entry, both_entries, 1)

          compile(script, '<waiting-ownership-patch>', 'exec')
          exec(script, {'__name__': '__main__'})

          tests = Path(
              'packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts'
          )
          test_lines = tests.read_text(encoding='utf-8').splitlines()
          ide_start = next(
              index
              for index, line in enumerate(test_lines)
              if "it('clears waiting state when IDE confirmation rejects'" in line
          )
          ide_end = next(
              index
              for index in range(ide_start + 1, len(test_lines))
              if "it('preserves the wait error when clearing state also throws'"
              in test_lines[index]
          )
          indent = test_lines[ide_start][
              : len(test_lines[ide_start]) - len(test_lines[ide_start].lstrip())
          ]
          body = indent + '  '
          deep = body + '  '
          replacement = [
              indent
              + "it('keeps waiting on the bus after IDE confirmation rejects', async () => {",
              body
              + "const warn = vi.spyOn(debugLogger, 'warn').mockImplementation(() => {});",
              body + 'let rejectIde!: (error: Error) => void;',
              body + 'const ideConfirmation = new Promise<never>((_resolve, reject) => {',
              deep + 'rejectIde = reject;',
              body + '});',
              body + 'const harness = createHarness({',
              deep + "type: 'info',",
              deep + "title: 'Approval',",
              deep + "prompt: 'Approve?',",
              deep + 'onConfirm: vi.fn(),',
              deep + 'ideConfirmation,',
              body + '});',
              body + 'const onWaiting = vi.fn();',
              body + 'const resolution = resolve(',
              deep + 'harness,',
              deep + 'new AbortController().signal,',
              deep + 'onWaiting,',
              body + ');',
              body + 'await waitForBus(harness);',
              body + "rejectIde(new Error('IDE confirmation failed'));",
              '',
              body + 'await vi.waitFor(() => {',
              deep + 'expect(warn).toHaveBeenCalledWith(',
              deep + "  'Error waiting for confirmation via IDE',",
              deep
              + "  expect.objectContaining({ message: 'IDE confirmation failed' }),",
              deep + ');',
              body + '});',
              body
              + 'expect(onWaiting.mock.calls.map(([waiting]) => waiting)).toEqual([true]);',
              '',
              body
              + 'harness.messageBus.emit(MessageBusType.TOOL_CONFIRMATION_RESPONSE, {',
              deep + 'type: MessageBusType.TOOL_CONFIRMATION_RESPONSE,',
              deep + 'correlationId: confirmationCorrelationId(harness),',
              deep + 'outcome: ToolConfirmationOutcome.Cancel,',
              body + '});',
              '',
              body + 'await expect(resolution).resolves.toMatchObject({',
              deep + 'outcome: ToolConfirmationOutcome.Cancel,',
              body + '});',
              body
              + 'expect(onWaiting.mock.calls.map(([waiting]) => waiting)).toEqual([',
              deep + 'true,',
              deep + 'false,',
              body + ']);',
              indent + '});',
              '',
          ]
          test_lines[ide_start:ide_end] = replacement
          tests.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run staged repair and adjacent controls
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.waiting-state.test.ts \
            src/scheduler/confirmation.waiting-state.repair.test.ts \
            src/scheduler/confirmation-wait-tracker.test.ts \
            src/scheduler/confirmation.test.ts
          npm run typecheck --workspace @google/gemini-cli-core
          npx prettier --check \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/scheduler.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts
          git diff --check

      - name: Record exact staged receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "unexpected branch head: $(git rev-parse HEAD); expected $EXPECTED_HEAD"
            exit 1
          }
          printf '%s\n' \
            "head=$(git rev-parse HEAD)" \
            "node=$(node --version)" \
            "npm=$(npm --version)"
          git diff --stat

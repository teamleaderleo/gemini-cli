name: Fieldwork confirmation waiting ownership repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-confirmation-waiting-state-repair.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-confirmation-waiting-state-repair
  cancel-in-progress: true

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/confirmation-waiting-state-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Apply waiting ownership repair and controls
        shell: python
        run: |
          from pathlib import Path

          confirmation = Path('packages/core/src/scheduler/confirmation.ts')
          text = confirmation.read_text(encoding='utf-8')

          helper_anchor = """\
          /**
           * Manages the interactive confirmation loop, handling user modifications
           * via inline diffs or external editors (Vim).
           */
          """
          helper = """\
          async function waitForConfirmationWithState(
            messageBus: MessageBus,
            correlationId: string,
            signal: AbortSignal,
            ideConfirmation: Promise<DiffUpdateResult> | undefined,
            onWaitingForConfirmation: ((waiting: boolean) => void) | undefined,
          ): Promise<ConfirmationResult> {
            onWaitingForConfirmation?.(true);

            let response: ConfirmationResult | undefined;
            let waitError: unknown;
            let waitFailed = false;
            try {
              response = await waitForConfirmation(
                messageBus,
                correlationId,
                signal,
                ideConfirmation,
              );
            } catch (error) {
              waitFailed = true;
              waitError = error;
            }

            try {
              onWaitingForConfirmation?.(false);
            } catch (cleanupError) {
              if (!waitFailed) {
                throw cleanupError;
              }
              debugLogger.warn(
                'Failed to clear confirmation waiting state after wait failure',
                cleanupError,
              );
            }

            if (waitFailed) {
              throw waitError;
            }
            return response!;
          }

          """
          if text.count(helper_anchor) != 1:
              raise SystemExit('confirmation helper insertion anchor mismatch')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_wait = """\
              onWaitingForConfirmation?.(true);
              const response = await waitForConfirmation(
                deps.messageBus,
                correlationId,
                signal,
                ideConfirmation,
              );
              onWaitingForConfirmation?.(false);
              outcome = response.outcome;
          """
          new_wait = """\
              const response = await waitForConfirmationWithState(
                deps.messageBus,
                correlationId,
                signal,
                ideConfirmation,
                onWaitingForConfirmation,
              );
              outcome = response.outcome;
          """
          if text.count(old_wait) != 1:
              raise SystemExit('confirmation wait block mismatch')
          confirmation.write_text(text.replace(old_wait, new_wait, 1), encoding='utf-8')

          scheduler = Path('packages/core/src/scheduler/scheduler.ts')
          text = scheduler.read_text(encoding='utf-8')
          import_anchor = "import { resolveConfirmation } from './confirmation.js';\n"
          import_replacement = (
              import_anchor
              + "import { ConfirmationWaitTracker } from './confirmation-wait-tracker.js';\n"
          )
          if text.count(import_anchor) != 1:
              raise SystemExit('scheduler import anchor mismatch')
          text = text.replace(import_anchor, import_replacement, 1)

          field_anchor = (
              '  private readonly onWaitingForConfirmation?: '
              '(waiting: boolean) => void;\n'
          )
          field_replacement = (
              '  private readonly confirmationWaitTracker: '
              'ConfirmationWaitTracker;\n'
          )
          if text.count(field_anchor) != 1:
              raise SystemExit('scheduler field anchor mismatch')
          text = text.replace(field_anchor, field_replacement, 1)

          constructor_anchor = (
              '    this.onWaitingForConfirmation = options.onWaitingForConfirmation;\n'
          )
          constructor_replacement = (
              '    this.confirmationWaitTracker = new ConfirmationWaitTracker(\n'
              '      options.onWaitingForConfirmation,\n'
              '    );\n'
          )
          if text.count(constructor_anchor) != 1:
              raise SystemExit('scheduler constructor anchor mismatch')
          text = text.replace(constructor_anchor, constructor_replacement, 1)

          pass_anchor = (
              '        onWaitingForConfirmation: this.onWaitingForConfirmation,\n'
          )
          pass_replacement = (
              '        onWaitingForConfirmation: '
              'this.confirmationWaitTracker.update,\n'
          )
          if text.count(pass_anchor) != 1:
              raise SystemExit('scheduler callback anchor mismatch')
          scheduler.write_text(text.replace(pass_anchor, pass_replacement, 1), encoding='utf-8')

          Path('packages/core/src/scheduler/confirmation-wait-tracker.ts').write_text(
              """\
          /**
           * Aggregates overlapping confirmation waits for one Scheduler.
           * The external callback observes only transitions between no active waits
           * and at least one active wait.
           */
          export class ConfirmationWaitTracker {
            private activeWaits = 0;

            constructor(
              private readonly onWaitingChange?: (waiting: boolean) => void,
            ) {}

            readonly update = (waiting: boolean): void => {
              if (waiting) {
                if (this.activeWaits === 0) {
                  this.onWaitingChange?.(true);
                }
                this.activeWaits += 1;
                return;
              }

              if (this.activeWaits === 0) {
                throw new Error(
                  'Cannot clear confirmation waiting state without an active wait',
                );
              }

              this.activeWaits -= 1;
              if (this.activeWaits === 0) {
                this.onWaitingChange?.(false);
              }
            };
          }
          """,
              encoding='utf-8',
          )

          Path('packages/core/src/scheduler/confirmation-wait-tracker.test.ts').write_text(
              """\
          /**
           * @license
           * Copyright 2026 Google LLC
           * SPDX-License-Identifier: Apache-2.0
           */

          import { describe, expect, it, vi } from 'vitest';
          import { ConfirmationWaitTracker } from './confirmation-wait-tracker.js';

          describe('ConfirmationWaitTracker', () => {
            it('keeps aggregate waiting true until every overlapping wait clears', () => {
              const onWaitingChange = vi.fn();
              const tracker = new ConfirmationWaitTracker(onWaitingChange);

              tracker.update(true);
              tracker.update(true);
              tracker.update(false);
              expect(onWaitingChange.mock.calls.map(([waiting]) => waiting)).toEqual([
                true,
              ]);

              tracker.update(false);
              expect(onWaitingChange.mock.calls.map(([waiting]) => waiting)).toEqual([
                true,
                false,
              ]);
            });

            it('rejects an unmatched clear instead of hiding ownership drift', () => {
              const tracker = new ConfirmationWaitTracker();
              expect(() => tracker.update(false)).toThrow(
                'without an active wait',
              );
            });

            it('does not retain a wait when the initial observer throws', () => {
              const onWaitingChange = vi
                .fn<(waiting: boolean) => void>()
                .mockImplementationOnce(() => {
                  throw new Error('observer start failed');
                });
              const tracker = new ConfirmationWaitTracker(onWaitingChange);

              expect(() => tracker.update(true)).toThrow('observer start failed');
              expect(() => tracker.update(false)).toThrow('without an active wait');
            });
          });
          """,
              encoding='utf-8',
          )

          Path(
              'packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts'
          ).write_text(
              """\
          /**
           * @license
           * Copyright 2026 Google LLC
           * SPDX-License-Identifier: Apache-2.0
           */

          import { EventEmitter } from 'node:events';
          import { describe, expect, it, vi, type Mocked } from 'vitest';
          import type { Config } from '../config/config.js';
          import type { MessageBus } from '../confirmation-bus/message-bus.js';
          import { MessageBusType } from '../confirmation-bus/types.js';
          import type {
            AnyDeclarativeTool,
            AnyToolInvocation,
            ToolCallConfirmationDetails,
          } from '../tools/tools.js';
          import { debugLogger } from '../utils/debugLogger.js';
          import { resolveConfirmation } from './confirmation.js';
          import type { SchedulerStateManager } from './state-manager.js';
          import type { ToolModificationHandler } from './tool-modifier.js';
          import {
            CoreToolCallStatus,
            ROOT_SCHEDULER_ID,
            type ValidatingToolCall,
          } from './types.js';

          function createHarness(details: ToolCallConfirmationDetails) {
            const messageBus = new EventEmitter() as unknown as MessageBus;
            messageBus.publish = vi.fn().mockResolvedValue(undefined);
            const invocation = {
              shouldConfirmExecute: vi.fn().mockResolvedValue(details),
            } as unknown as Mocked<AnyToolInvocation>;
            const toolCall = {
              status: CoreToolCallStatus.Validating,
              request: {
                callId: 'call-1',
                name: 'tool',
                args: {},
                isClientInitiated: false,
                prompt_id: 'prompt-1',
              },
              invocation,
              tool: { build: vi.fn() } as unknown as AnyDeclarativeTool,
            } as ValidatingToolCall;
            const state = {
              getToolCall: vi.fn().mockReturnValue(toolCall),
              updateStatus: vi.fn(),
              updateArgs: vi.fn(),
            } as unknown as Mocked<SchedulerStateManager>;
            const modifier = {
              applyInlineModify: vi.fn(),
              handleModifyWithEditor: vi.fn(),
            } as unknown as Mocked<ToolModificationHandler>;
            const config = {
              getHookSystem: vi.fn().mockReturnValue(undefined),
            } as unknown as Mocked<Config>;
            return { config, messageBus, modifier, state, toolCall };
          }

          function resolve(
            harness: ReturnType<typeof createHarness>,
            signal: AbortSignal,
            onWaitingForConfirmation: (waiting: boolean) => void,
          ) {
            return resolveConfirmation(harness.toolCall, signal, {
              config: harness.config,
              messageBus: harness.messageBus,
              state: harness.state,
              modifier: harness.modifier,
              getPreferredEditor: () => undefined,
              schedulerId: ROOT_SCHEDULER_ID,
              onWaitingForConfirmation,
            });
          }

          async function waitForBus(harness: ReturnType<typeof createHarness>) {
            await vi.waitFor(() => {
              expect(
                harness.messageBus.listenerCount(
                  MessageBusType.TOOL_CONFIRMATION_RESPONSE,
                ),
              ).toBeGreaterThan(0);
            });
          }

          describe('confirmation waiting ownership repair', () => {
            it('clears waiting state when the message-bus wait is aborted', async () => {
              const harness = createHarness({
                type: 'info',
                title: 'Approval',
                prompt: 'Approve?',
                onConfirm: vi.fn(),
              });
              const onWaiting = vi.fn();
              const controller = new AbortController();
              const resolution = resolve(harness, controller.signal, onWaiting);
              await waitForBus(harness);
              controller.abort();

              await expect(resolution).rejects.toThrow('Operation cancelled');
              expect(onWaiting.mock.calls.map(([waiting]) => waiting)).toEqual([
                true,
                false,
              ]);
            });

            it('clears waiting state when IDE confirmation rejects', async () => {
              let rejectIde!: (error: Error) => void;
              const ideConfirmation = new Promise<never>((_resolve, reject) => {
                rejectIde = reject;
              });
              const harness = createHarness({
                type: 'info',
                title: 'Approval',
                prompt: 'Approve?',
                onConfirm: vi.fn(),
                ideConfirmation,
              });
              const onWaiting = vi.fn();
              const resolution = resolve(
                harness,
                new AbortController().signal,
                onWaiting,
              );
              await waitForBus(harness);
              rejectIde(new Error('IDE confirmation failed'));

              await expect(resolution).rejects.toThrow('IDE confirmation failed');
              expect(onWaiting.mock.calls.map(([waiting]) => waiting)).toEqual([
                true,
                false,
              ]);
            });

            it('preserves the wait error when clearing state also throws', async () => {
              const warn = vi.spyOn(debugLogger, 'warn').mockImplementation(() => {});
              const harness = createHarness({
                type: 'info',
                title: 'Approval',
                prompt: 'Approve?',
                onConfirm: vi.fn(),
              });
              const onWaiting = vi.fn((waiting: boolean) => {
                if (!waiting) throw new Error('clear observer failed');
              });
              const controller = new AbortController();
              const resolution = resolve(harness, controller.signal, onWaiting);
              await waitForBus(harness);
              controller.abort();

              await expect(resolution).rejects.toThrow('Operation cancelled');
              expect(warn).toHaveBeenCalledWith(
                'Failed to clear confirmation waiting state after wait failure',
                expect.objectContaining({ message: 'clear observer failed' }),
              );
            });

            it('propagates a clear observer error after a successful wait', async () => {
              const harness = createHarness({
                type: 'info',
                title: 'Approval',
                prompt: 'Approve?',
                onConfirm: vi.fn(),
              });
              const onWaiting = vi.fn((waiting: boolean) => {
                if (!waiting) throw new Error('clear observer failed');
              });
              const resolution = resolve(
                harness,
                new AbortController().signal,
                onWaiting,
              );
              await waitForBus(harness);
              harness.messageBus.emit(MessageBusType.TOOL_CONFIRMATION_RESPONSE, {
                type: MessageBusType.TOOL_CONFIRMATION_RESPONSE,
                correlationId: expect.anything(),
                outcome: 'proceed_once',
              });

              await expect(resolution).rejects.toThrow('clear observer failed');
            });
          });
          """,
              encoding='utf-8',
          )

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run waiting ownership and adjacent confirmation controls
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.waiting-state.test.ts \
            src/scheduler/confirmation.waiting-state.repair.test.ts \
            src/scheduler/confirmation-wait-tracker.test.ts \
            src/scheduler/confirmation.test.ts
          npm run typecheck --workspace @google/gemini-cli-core
          npx prettier --check \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/scheduler.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts
          git diff --check

      - name: Publish source and tests only
        run: |
          rm .github/workflows/fieldwork-confirmation-waiting-state.yml
          rm .github/workflows/fieldwork-confirmation-waiting-state-repair.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add packages/core/src/scheduler .github/workflows
          git commit -m 'fix(scheduler): balance confirmation waiting ownership'
          git push origin HEAD:fieldwork/confirmation-waiting-state-repair

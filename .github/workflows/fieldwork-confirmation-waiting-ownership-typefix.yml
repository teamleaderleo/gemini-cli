name: Fieldwork confirmation waiting ownership typed receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-confirmation-waiting-ownership-typefix.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-confirmation-waiting-ownership-typefix
  cancel-in-progress: true

jobs:
  typed-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Apply reviewed staged repair and fixture type corrections
        shell: python
        run: |
          from pathlib import Path

          exact_workflow = Path(
              '.github/workflows/fieldwork-confirmation-waiting-ownership-exact.yml'
          ).read_text(encoding='utf-8').splitlines()
          step = exact_workflow.index(
              '      - name: Apply the reviewed staged repair'
          )
          run_line = next(
              index
              for index in range(step + 1, len(exact_workflow))
              if exact_workflow[index].strip() == 'run: |'
          )
          end = next(
              index
              for index in range(run_line + 1, len(exact_workflow))
              if exact_workflow[index].startswith('      - name: Use Node.js 22')
          )
          script_lines = []
          for line in exact_workflow[run_line + 1 : end]:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected staged-script indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'
          compile(script, '<waiting-ownership-exact-patch>', 'exec')
          exec(script, {'__name__': '__main__'})

          tests = Path(
              'packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts'
          )
          text = tests.read_text(encoding='utf-8')
          old_signature = (
              'function createHarness(details: ToolCallConfirmationDetails) {'
          )
          new_signature = '''type ConfirmationDetailsWithIde = ToolCallConfirmationDetails & {
            ideConfirmation?: Promise<never>;
          };

          function createHarness(details: ConfirmationDetailsWithIde) {'''
          if text.count(old_signature) != 1:
              raise SystemExit('createHarness signature mismatch')
          text = text.replace(old_signature, new_signature, 1)

          old_find = (
              'const statusCall = harness.state.updateStatus.mock.calls.find('
          )
          new_find = '''const statusCalls = harness.state.updateStatus.mock.calls as unknown as Array<
                [string, CoreToolCallStatus, { correlationId?: string }?]
              >;
              const statusCall = statusCalls.find('''
          if text.count(old_find) != 1:
              raise SystemExit('updateStatus find anchor mismatch')
          tests.write_text(text.replace(old_find, new_find, 1), encoding='utf-8')

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run typed staged repair and adjacent controls
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.waiting-state.test.ts \
            src/scheduler/confirmation.waiting-state.repair.test.ts \
            src/scheduler/confirmation-wait-tracker.test.ts \
            src/scheduler/confirmation.test.ts
          npm run typecheck --workspace @google/gemini-cli-core
          npx prettier --check \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/scheduler.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.ts \
            packages/core/src/scheduler/confirmation-wait-tracker.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.test.ts \
            packages/core/src/scheduler/confirmation.waiting-state.repair.test.ts
          git diff --check

      - name: Record exact typed receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' \
            "head=$(git rev-parse HEAD)" \
            "node=$(node --version)" \
            "npm=$(npm --version)" \
            'FIELDWORK_WAITING_OWNERSHIP_TYPED=16/16'
          git diff --stat

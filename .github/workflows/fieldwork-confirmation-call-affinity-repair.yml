name: Fieldwork confirmation call affinity repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fieldwork-confirmation-call-affinity-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_HEAD: f47d6c6f7a1308d81f9f57acf7d279f0928c5249
  SOURCE_HEAD: 0c3a86b0555e152b50ca55fd5f8dc53608571cbe
  SOURCE_BRANCH: fix/scheduler-confirmation-call-affinity

jobs:
  validate:
    name: ${{ matrix.mode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            mode: focused
          - os: ubuntu-22.04
            mode: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/gemini-cli
          ref: 0c3a86b0555e152b50ca55fd5f8dc53608571cbe
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.19.0
          cache: npm
      - name: Verify immutable source identity and fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD"..."$SOURCE_HEAD" | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          packages/core/src/scheduler/confirmation.affinity.repair.test.ts
          packages/core/src/scheduler/confirmation.test.ts
          packages/core/src/scheduler/confirmation.ts
          packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          EOF
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE_HEAD"..."$SOURCE_HEAD"
      - name: Install locked dependencies
        run: npm ci
      - name: Check source formatting
        run: |
          npx prettier --check \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
      - name: Run affinity and adjacent controls
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.affinity.repair.test.ts \
            src/scheduler/scheduler.confirmation-affinity.test.ts \
            src/scheduler/confirmation.test.ts
      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core
      - name: Run project preflight
        if: matrix.mode == 'preflight'
        run: npm run preflight
      - name: Verify clean tracked tree
        run: git diff --exit-code
      - name: Publish canonical clean source branch
        if: matrix.mode == 'preflight'
        shell: bash
        run: |
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          printf '%s\n' \
            "source_head=$(git rev-parse HEAD)" \
            "source_base=$(git rev-parse HEAD^)" \
            "os=${{ matrix.os }}" \
            "node=$(node --version)" \
            "npm=$(npm --version)"

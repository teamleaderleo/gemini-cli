name: Fieldwork confirmation call affinity repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fieldwork-confirmation-call-affinity-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_HEAD: f47d6c6f7a1308d81f9f57acf7d279f0928c5249
  SOURCE_HEAD: 0c3a86b0555e152b50ca55fd5f8dc53608571cbe
  SOURCE_BRANCH: fix/scheduler-confirmation-call-affinity

jobs:
  baseline-lint-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/gemini-cli
          ref: f47d6c6f7a1308d81f9f57acf7d279f0928c5249
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require the unchanged base to reproduce the preflight lint blocker
        shell: bash
        run: |
          set +e
          npm run lint:ci 2>&1 | tee /tmp/base-lint.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'pr-size-labeler-batch-run.yml' /tmp/base-lint.log
          grep -F 'SC2031' /tmp/base-lint.log
          printf '%s\n' \
            "baseline_head=$(git rev-parse HEAD)" \
            "baseline_lint_status=$status" \
            "baseline_blocker=.github/workflows/pr-size-labeler-batch-run.yml:SC2031"

  repair-validate-publish:
    needs: baseline-lint-control
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: teamleaderleo/gemini-cli
          ref: 0c3a86b0555e152b50ca55fd5f8dc53608571cbe
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.19.0
          cache: npm
      - name: Verify source identity and initial fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD"..."$SOURCE_HEAD" | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          packages/core/src/scheduler/confirmation.affinity.repair.test.ts
          packages/core/src/scheduler/confirmation.test.ts
          packages/core/src/scheduler/confirmation.ts
          packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          EOF
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$BASE_HEAD"..."$SOURCE_HEAD"
      - name: Install locked dependencies
        run: npm ci
      - name: Correct scheduler response fixture
        shell: python
        run: |
          import re
          from pathlib import Path

          test_file = Path(
              'packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts'
          )
          text = test_file.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(responseParts: \[\],\n)([ \t]+)(\} as ToolCallResponseInfo,)'
          )

          def replacement(match: re.Match[str]) -> str:
              closing_indent = match.group(2)
              field_indent = f'{closing_indent}  '
              return (
                  match.group(1)
                  + field_indent
                  + 'resultDisplay: undefined,\n'
                  + field_indent
                  + 'error: undefined,\n'
                  + field_indent
                  + 'errorType: undefined,\n'
                  + closing_indent
                  + match.group(3)
              )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'executor response fixture match count: {count}')
          test_file.write_text(updated, encoding='utf-8')
      - name: Normalize formatting and create clean repaired commit
        run: |
          set -euo pipefail
          npx prettier --write \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          npx prettier --check \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          git diff --check
          git reset --soft "$BASE_HEAD"
          git reset
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
          git commit -m 'fix(scheduler): bind confirmation modification to correlated call'
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD"...HEAD | sort > /tmp/repaired-files
          diff -u /tmp/expected-files /tmp/repaired-files
          git diff --check "$BASE_HEAD"...HEAD
          printf '%s\n' "repaired_source_head=$(git rev-parse HEAD)"
      - name: Run affinity and adjacent controls
        run: |
          npm run test --workspace @google/gemini-cli-core -- \
            src/scheduler/confirmation.affinity.repair.test.ts \
            src/scheduler/scheduler.confirmation-affinity.test.ts \
            src/scheduler/confirmation.test.ts
      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core
      - name: Lint the complete unit 16 source fence
        run: |
          npx eslint --max-warnings 0 --no-warn-ignored \
            packages/core/src/scheduler/confirmation.ts \
            packages/core/src/scheduler/confirmation.affinity.repair.test.ts \
            packages/core/src/scheduler/confirmation.test.ts \
            packages/core/src/scheduler/scheduler.confirmation-affinity.test.ts
      - name: Verify clean tracked tree
        run: git diff --exit-code
      - name: Publish canonical clean source branch
        run: |
          git push --force origin "HEAD:refs/heads/$SOURCE_BRANCH"
          printf '%s\n' \
            "source_head=$(git rev-parse HEAD)" \
            "source_base=$(git rev-parse HEAD^)" \
            "node=$(node --version)" \
            "npm=$(npm --version)" \
            "full_preflight=blocked_by_confirmed_base_SC2031"

name: Fieldwork finalize confirmation waiting carrier repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-fix-confirmation-waiting-carrier-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/confirmation-waiting-state-repair
          persist-credentials: true

      - name: Repair carrier using line structure
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              '.github/workflows/fieldwork-confirmation-waiting-state-repair.yml'
          )
          lines = path.read_text(encoding='utf-8').splitlines()

          start = next(
              i for i, line in enumerate(lines) if line.strip() == 'pass_anchor = ('
          )
          end = next(
              i
              for i in range(start, len(lines))
              if 'scheduler.write_text(text.replace(pass_anchor' in lines[i]
          )
          lines[start : end + 1] = [
              "          pass_anchor = 'onWaitingForConfirmation: this.onWaitingForConfirmation'",
              "          pass_replacement = 'onWaitingForConfirmation: this.confirmationWaitTracker.update'",
              "          if text.count(pass_anchor) != 1:",
              "              raise SystemExit('scheduler callback anchor mismatch')",
              "          scheduler.write_text(",
              "              text.replace(pass_anchor, pass_replacement, 1),",
              "              encoding='utf-8',",
              "          )",
          ]

          test_start = next(
              i
              for i, line in enumerate(lines)
              if 'confirmation.waiting-state.repair.test.ts' in line
          )
          test_end = next(
              i
              for i in range(test_start + 1, len(lines))
              if lines[i].strip() == '""",'
          )

          vi_line = next(
              i
              for i in range(test_start, test_end)
              if "import { describe, expect, it, vi, type Mocked } from 'vitest';"
              in lines[i]
          )
          indent = lines[vi_line][:
              len(lines[vi_line]) - len(lines[vi_line].lstrip())
          ]
          lines[vi_line] = (
              indent
              + "import { afterEach, describe, expect, it, vi, type Mocked } from 'vitest';"
          )

          tool_import = next(
              i
              for i in range(test_start, test_end)
              if lines[i].strip() == 'import type {'
              and 'AnyDeclarativeTool' in lines[i + 1]
          )
          tool_import_end = next(
              i
              for i in range(tool_import, test_end)
              if "from '../tools/tools.js';" in lines[i]
          )
          indent = lines[tool_import][:
              len(lines[tool_import]) - len(lines[tool_import].lstrip())
          ]
          lines[tool_import : tool_import_end + 1] = [
              indent + 'import {',
              indent + '  ToolConfirmationOutcome,',
              indent + '  type AnyDeclarativeTool,',
              indent + '  type AnyToolInvocation,',
              indent + '  type ToolCallConfirmationDetails,',
              indent + "} from '../tools/tools.js';",
          ]
          test_end += 1

          describe_line = next(
              i
              for i in range(test_start, test_end)
              if "describe('confirmation waiting ownership repair'" in lines[i]
          )
          indent = lines[describe_line][:
              len(lines[describe_line]) - len(lines[describe_line].lstrip())
          ]
          helper = [
              indent + 'function confirmationCorrelationId(',
              indent + '  harness: ReturnType<typeof createHarness>,',
              indent + '): string {',
              indent + '  const statusCall = harness.state.updateStatus.mock.calls.find(',
              indent + '    ([, status]) => status === CoreToolCallStatus.AwaitingApproval,',
              indent + '  );',
              indent + '  const data = statusCall?.[2] as',
              indent + '    | { correlationId?: string }',
              indent + '    | undefined;',
              indent + '  expect(data?.correlationId).toBeDefined();',
              indent + "  return data?.correlationId ?? '';",
              indent + '}',
              '',
              lines[describe_line],
              indent + '  afterEach(() => {',
              indent + '    vi.restoreAllMocks();',
              indent + '  });',
          ]
          lines[describe_line : describe_line + 1] = helper
          test_end += len(helper) - 1

          correlation_line = next(
              i
              for i in range(test_start, test_end)
              if lines[i].strip() == 'correlationId: expect.anything(),'
          )
          prefix = lines[correlation_line][:
              len(lines[correlation_line])
              - len(lines[correlation_line].lstrip())
          ]
          lines[correlation_line] = (
              prefix + 'correlationId: confirmationCorrelationId(harness),'
          )

          outcome_line = next(
              i
              for i in range(test_start, test_end)
              if lines[i].strip() == "outcome: 'proceed_once',"
          )
          prefix = lines[outcome_line][:
              len(lines[outcome_line]) - len(lines[outcome_line].lstrip())
          ]
          lines[outcome_line] = (
              prefix + 'outcome: ToolConfirmationOutcome.ProceedOnce,'
          )

          mock_start = next(
              i
              for i, line in enumerate(lines)
              if line.strip() == 'const onWaitingChange = vi'
          )
          mock_end = next(
              i
              for i in range(mock_start, len(lines))
              if lines[i].strip() == '});'
          )
          indent = lines[mock_start][:
              len(lines[mock_start]) - len(lines[mock_start].lstrip())
          ]
          lines[mock_start : mock_end + 1] = [
              indent + 'const onWaitingChange = vi.fn((_waiting: boolean) => {});',
              indent + 'onWaitingChange.mockImplementationOnce(() => {',
              indent + "  throw new Error('observer start failed');",
              indent + '});',
          ]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Publish repaired carrier
        run: |
          rm -f .github/workflows/fieldwork-fix-confirmation-waiting-carrier.yml
          rm -f .github/workflows/fieldwork-fix-confirmation-waiting-carrier-pr.yml
          rm -f .github/workflows/fieldwork-fix-confirmation-waiting-carrier-v2.yml
          rm .github/workflows/fieldwork-fix-confirmation-waiting-carrier-v3.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add .github/workflows
          git commit -m 'ci(fieldwork): finalize waiting ownership carrier repair'
          git push origin HEAD:fieldwork/confirmation-waiting-state-repair

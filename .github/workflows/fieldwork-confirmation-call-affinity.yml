name: fieldwork-confirmation-call-affinity

on:
  push:
    branches:
      - fieldwork/confirmation-call-affinity
  pull_request:
    branches:
      - main
    paths:
      - packages/core/src/scheduler/confirmation.affinity.test.ts
      - .github/workflows/fieldwork-confirmation-call-affinity.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-confirmation-call-affinity
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute call-affinity regression
        id: regression
        continue-on-error: true
        run: npm run test --workspace @google/gemini-cli-core -- src/scheduler/confirmation.affinity.test.ts
      - name: Require correlated-call failure
        env:
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected the source-confirmed call-affinity regression to fail; observed: $OUTCOME"
            exit 1
          fi
      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core
      - name: Record exact receipt
        run: |
          printf '%s\n' \
            "head=$(git rev-parse HEAD)" \
            "node=$(node --version)" \
            "npm=$(npm --version)" \
            "regression_outcome=${{ steps.regression.outcome }}"

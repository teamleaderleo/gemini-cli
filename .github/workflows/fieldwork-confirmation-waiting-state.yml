name: fieldwork-confirmation-waiting-state

on:
  push:
    branches:
      - fieldwork/confirmation-waiting-finally
  pull_request:
    branches:
      - main
    paths:
      - packages/core/src/scheduler/confirmation.waiting-state.test.ts
      - .github/workflows/fieldwork-confirmation-waiting-state.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-confirmation-waiting-state
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute waiting-state regression
        run: npm run test --workspace @google/gemini-cli-core -- src/scheduler/confirmation.waiting-state.test.ts
      - name: Typecheck core workspace
        run: npm run typecheck --workspace @google/gemini-cli-core
